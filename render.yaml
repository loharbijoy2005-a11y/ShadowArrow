services:
  # Golang API Backend Service
  # AI chat is forwarded via HTTP proxy to the external AI microservice (separate repo/deployment).
  - type: web
    name: shadow-arrow-backend
    env: go
    buildCommand: cd backend && go build -o server main.go
    startCommand: cd backend && ./server
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DATABASE_NAME
        value: shadow_arrow_db
      - key: JWT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ADMIN_MASTER_PASS
        sync: false
      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
      - key: SHIPROCKET_PICKUP_LOCATION
        value: warehouse
      # Full URL of the standalone Python AI microservice (separate Render deployment)
      # Live production URL: https://python-ai-nxmn.onrender.com
      - key: AI_SERVICE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://shadowarrow.in,https://www.shadowarrow.in
