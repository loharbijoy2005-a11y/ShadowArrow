name: Full-Stack Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for deep secret scanning

      - name: Setup Node.js (For Admin Dashboard & Storefront)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run NPM Audit on Admin Dashboard
        working-directory: ./admin-dashboard
        run: npm audit --audit-level=high

      - name: Setup Go (For Golang Backend)
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run GoSec (Golang Security Scanner)
        working-directory: ./backend
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

      - name: Run TruffleHog (Secret Scanner)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
