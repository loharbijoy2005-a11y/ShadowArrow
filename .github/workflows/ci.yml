name: Full-Stack CI Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-go-backend:
    name: Validate Go Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        working-directory: ./backend
        run: go mod download

      - name: Verify compilation
        working-directory: ./backend
        run: go build -o /dev/null main.go

  validate-python-service:
    name: Validate Python AI Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./python_service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax Check
        working-directory: ./python_service
        run: python -m py_compile main.py config.py gemini_service.py backend_client.py

  validate-storefront:
    name: Validate Next.js Storefront
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./storefront/package-lock.json

      - name: Install dependencies
        working-directory: ./storefront
        run: npm ci

      - name: Check Build
        working-directory: ./storefront
        run: npm run build

  validate-admin-dashboard:
    name: Validate Next.js Admin Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./admin-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: ./admin-dashboard
        run: npm ci

      - name: Check Build
        working-directory: ./admin-dashboard
        run: npm run build
